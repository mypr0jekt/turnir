{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Kirish</h1>
  <form method="post" novalidate>
    {{ csrf() }}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" inputmode="email" autocomplete="username" required>
    <label for="password">Parol</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <br><button class="btn block">Kirish</button>
  </form>
  <p class="center muted small"><br>Akkaunt yo'qmi? <a href="{{ url_for('register') }}">Ro'yxatdan o'tish</a></p>
</div>
{% endblock %}
